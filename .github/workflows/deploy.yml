name: build-and-publish

# Todo push na main publica uma imagem nova no GHCR. O Watchtower rodando na
# box do CasaOS detecta a imagem e recria o container sozinho — não há conexão
# de entrada do GitHub para a máquina.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # A box do CasaOS é x86_64. Para um CasaOS em Raspberry Pi, troque
          # por "linux/amd64,linux/arm64" (o arm64 é emulado e demora bem mais).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
